# Keeps /projects in step with the MaaSecLab GitHub organisation. The site is
# a static export, so repo data is fetched here and committed; the commit
# triggers the normal Pages rebuild.

name: Sync GitHub projects

on:
  schedule:
    # Daily, 05:30 UTC — new repos should show up without anyone remembering
    # to run this.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch public repositories
        run: node scripts/sync-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if the list changed
        run: |
          if [ -z "$(git status --porcelain content/projects.json)" ]; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/projects.json
          git commit -m "Sync GitHub projects"
          git pull --rebase
          git push
