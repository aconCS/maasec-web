name: Set Worker secret

# Sets one secret on the maasec-apply form Worker, using the repo's existing
# CLOUDFLARE_API_TOKEN. Run it by hand from the Actions tab (or
# `gh workflow run set-worker-secret.yml -f name=... -f value=...`).
#
# The value never appears in the repo or the logs: it is read from the run's
# private event payload, masked before anything else runs, and piped to
# wrangler on stdin. Setting a secret redeploys the Worker with it.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Secret to set on the maasec-apply Worker
        type: choice
        options:
          - SHEET_WEBHOOK_URL
          - SHEET_TOKEN
          - RESEND_API_KEY
        required: true
      value:
        description: Secret value (masked in logs, never stored in the repo)
        required: true

permissions:
  contents: read

concurrency:
  group: set-worker-secret
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set secret on the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_NAME: ${{ inputs.name }}
        run: |
          value="$(jq -r '.inputs.value' "$GITHUB_EVENT_PATH")"
          echo "::add-mask::$value"
          printf '%s' "$value" | npx --yes wrangler@4 secret put "$SECRET_NAME" -c worker/wrangler.jsonc
